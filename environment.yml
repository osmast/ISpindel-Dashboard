# Miniconda environment - used locally (macOS) and on the Raspberry Pi (aarch64).
#
#   conda env create -f environment.yml
#   conda activate beer
#
name: beer
channels:
  - conda-forge
  - nodefaults        # keep the Anaconda "defaults" channel out of the resolution
dependencies:
  - python=3.12
  - pip
  - pip:
      - dash>=3.0            # web dashboard (Flask + React underneath)
      - dash-mantine-components>=2.8   # dmc.Grid for the card layout
      - dash-iconify>=0.1    # pencil / trash icons for the table's edit + delete buttons
      - plotly>=6.0          # dials and fermentation charts
      - paho-mqtt>=2.1       # MQTT client for the ingest service
      - "psycopg[binary]>=3.2"   # PostgreSQL driver
      - PyYAML>=6.0          # reads config.yml
      - gunicorn>=22.0       # production server for the dashboard
      - amqtt>=0.11          # local test broker (the Pi uses apt mosquitto instead)
      - pyserial>=3.5        # USB serial console for debugging the iSpindel

