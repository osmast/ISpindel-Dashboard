# Broker configuration of the iSpindel fermentation monitor, mounted read-only into the mosquitto
# container by compose.yaml. mosquitto 2.x refuses to listen on the network until a `listener`
# is configured. Credentials are not needed inside the local network; see the README if the
# broker ever has to be reachable from outside (NFR-02).
listener 1883 0.0.0.0
allow_anonymous true

# hold messages while the ingest service is down
max_queued_messages 10000
