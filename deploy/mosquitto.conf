# Broker configuration for the Raspberry Pi: copy to /etc/mosquitto/conf.d/ispindel.conf
#
#   sudo cp deploy/mosquitto.conf /etc/mosquitto/conf.d/ispindel.conf
#   sudo systemctl restart mosquitto
#   ss -ltn | grep 1883        # must show 0.0.0.0:1883 - not 127.0.0.1:1883
#
# Why these lines: mosquitto 2.x refuses to listen on the network until a `listener`
# is configured - without it the iSpindel cannot reach the broker at all.
#
# Do NOT add "persistence" / "persistence_location" here: the Debian/Raspberry Pi OS
# package already sets them in /etc/mosquitto/mosquitto.conf, and mosquitto refuses
# to start on a duplicate persistence_location ("Duplicate persistence_location value").
listener 1883 0.0.0.0
allow_anonymous true

# hold messages while the ingest service is down
max_queued_messages 10000

# --- LAN-only test broker ------------------------------------------------
# allow_anonymous true is fine inside the local network (NFR-02: nothing is
# published to the internet). If the broker must be reachable from the internet
# (fermenter on another network, see README 2.5), switch to credentials:
#
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd ispindel
#   # then in this file:   allow_anonymous false
#   #                     password_file /etc/mosquitto/passwd
#   # and in the iSpindel portal: Username / Password fields
# ------------------------------------------------------------------------

# --- standalone use (macOS, Docker) needs its own persistence paths ------
#   mosquitto -c deploy/mosquitto.conf -v
#   persistence true
#   persistence_location data/
#
#   docker run -d --name ispindel-mqtt -p 1883:1883 eclipse-mosquitto:2
#   (mount this file to /mosquitto/config/mosquitto.conf and a volume to /mosquitto/data)
# ------------------------------------------------------------------------
