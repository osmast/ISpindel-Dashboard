# Settings for the iSpindel fermentation monitor (NFR-08: settings live here, not in the code).
# Committed and free of machine-specific values: it describes the single-machine setup that
# compose.yaml implements, so nothing has to be rewritten on another machine. A container run
# overrides only the addresses (ISPINDEL_DB_DSN, ISPINDEL_MQTT_HOST, ISPINDEL_MQTT_PORT,
# ISPINDEL_MQTT_CLIENT_ID); ISPINDEL_CONFIG points a component at a different file.

database:
  # Only used by a run without containers (PostgreSQL on localhost).
  dsn: "postgresql://ispindel:ispindel@localhost:5432/ispindel"

mqtt:
  host: "localhost"
  port: 1883
  client_id: "ispindel-ingest"   # must be unique per broker, or two clients kick each other off
  topic_prefix: "ispindel"       # topics are <prefix>/<device name>/<field>
  username: null                 # null = anonymous (deploy/mosquitto.conf)
  password: null
  keepalive_seconds: 120

ingest:
  burst_seconds: 10              # fallback: max wait for the missing messages of a transmission
  gravity_unit: "P"              # unit of the calibration polynomial: "P" (Plato) or "SG"
  log_messages: true             # print every received topic - useful while testing hardware

dashboard:
  host: "0.0.0.0"
  port: 8080
  refresh_ms: 15000              # FR-14: chart refresh, must stay below 60000
  live_ms: 1000                  # countdown: re-read the latest timestamps + tick the display
  battery_warn_v: 3.5            # FR-19: warning below this voltage
  battery_full_v: 4.2            # 100 % on the battery gauge (one 18650 Li-Ion cell)
  battery_empty_v: 3.3           # 0 % on the battery gauge
  device_chart_days: 14          # history window of the per-iSpindel fermentation chart
  expected_attenuation: 80       # FR-20: target FG = og * (1 - 0.80), and the ABV estimate
  target_temp_c:                 # FR-20: target window per beer style (substring match), else default
    default: [18.0, 22.0]
    ipa: [19.0, 21.0]
    pale: [18.0, 22.0]
    ale: [18.0, 22.0]
    hefeweizen: [18.0, 22.0]
    lager: [9.0, 13.0]
    bock: [10.0, 14.0]
  timezone: "Europe/Zurich"      # NFR-09: stored in UTC, displayed in local time
