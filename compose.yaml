# The app stack: database, broker and dashboard (three containers) plus two optional services that
# only start with a profile - `ingest` (records a real iSpindel, `--profile ingest`) and `seed`
# (mock data, `--profile demo`).
#
#   podman compose up -d --build     (or `docker compose ...`) -> http://localhost:8080
#
# The commands for start/stop/logs/tests are in the README (`<engine>` = podman or docker).
# The `pgdata` volume keeps the measurements across `down`, a rebuild and a reboot
# (NFR-03/NFR-04). The schema is applied by PostgreSQL itself on the first start.
name: ispindel

services:

  db:
    # Fully qualified image name: a bare `postgres:16-alpine` needs a short-name alias in the
    # host's /etc/containers/registries.conf and fails on a fresh Raspberry Pi with
    #   Error: short-name "postgres:16-alpine" did not resolve to an alias ...
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ispindel
      POSTGRES_PASSWORD: ispindel
      POSTGRES_DB: ispindel
      TZ: UTC                        # stored in UTC, the dashboard converts (NFR-09)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:${ISPINDEL_PG_PORT:-5433}:5432"    # loopback only; the port only for host psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispindel -d ispindel"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  broker:
    image: docker.io/library/eclipse-mosquitto:2    # fully qualified, see the note at `db`
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - brokerdata:/mosquitto/data
    ports:
      - "1883:1883"                  # the iSpindel publishes here
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 5s

  # One MQTT transmission = 7 messages -> exactly one measurement row (FR-11).
  #
  # This service is NOT part of what a plain `up` starts (profile `ingest`): the dashboard, the
  # demo data and every UI/self-test run without it - only a real iSpindel needs it. It stays
  # defined here instead of in a raw `docker run` README line so that the DSN, the network and the
  # mounts live in this one file (NFR-08).
  #   <engine> compose --profile ingest up -d ingest      -> record the iSpindel, stays running
  #   <engine> compose --profile ingest run --rm ingest   -> same, one-off in the foreground
  #   <engine> compose --profile ingest down              -> stop the stack incl. the ingest
  # `up -d ingest` alone works too (naming a service activates its profile); a plain
  # `compose down` does NOT remove the ingest container.
  ingest:
    image: ispindel-monitor:latest
    build: .
    profiles: ["ingest"]
    restart: unless-stopped
    command: python -u services/mqtt_service.py
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      # Inside the container network the services are `db` and `broker` (NFR-08).
      ISPINDEL_DB_DSN: postgresql://ispindel:ispindel@db:5432/ispindel
      ISPINDEL_MQTT_HOST: broker
      ISPINDEL_MQTT_CLIENT_ID: ispindel-ingest
      TZ: UTC
    volumes:
      # the source is mounted so an edit only needs a container restart, not a rebuild
      - ./config.yml:/repo/config.yml:ro
      - ./services:/repo/services:ro

  dashboard:
    image: ispindel-monitor:latest
    build: .
    restart: unless-stopped
    # `ISPINDEL_DASHBOARD_CMD="python main.py"` (README section 5) gives Dash hot reload.
    #
    # List form + `sh -c ... exec` on purpose: podman-compose (1.3.0, the Raspberry Pi) does **not**
    # expand `${VAR:-default}` inside `command:` - it splits the string and hands the first word to
    # crun, which fails with
    #   crun: executable file `${ISPINDEL_DASHBOARD_CMD:-gunicorn` not found in $PATH
    # (Docker Compose expands it, so the plain string worked on macOS and broke on the Pi only.)
    # As a list, the shell inside the container does the expansion, and `exec` keeps gunicorn as
    # PID 1 - without it a `down` would have to SIGKILL the dashboard after the 10 s timeout.
    command: ["sh", "-c", "exec ${ISPINDEL_DASHBOARD_CMD:-gunicorn main:server -b 0.0.0.0:8080 --workers 1 --threads 4 --timeout 120}"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISPINDEL_DB_DSN: postgresql://ispindel:ispindel@db:5432/ispindel
      TZ: UTC
    ports:
      - "${ISPINDEL_HTTP_PORT:-8080}:8080"      # NFR-02: the LAN opens <host>:8080
    volumes:
      - ./config.yml:/repo/config.yml:ro
      - ./main.py:/repo/main.py
      - ./services:/repo/services
      - ./components:/repo/components
      - ./assets:/repo/assets
      - ./tools:/repo/tools:ro

  # Optional demo data: `--profile demo` also starts this one-shot service, which seeds the
  # simulated fleet once the database is ready and then exits. Without the profile the stack
  # stays empty.
  #   <engine> compose --profile demo up -d --build        -> the app shows the mock data
  #   <engine> compose exec -T dashboard python tools/simulate.py --delete   -> remove it again
  seed:
    image: ispindel-monitor:latest
    build: .
    profiles: ["demo"]
    restart: "no"
    # wait for the schema as well: on a fresh volume `pg_isready` can answer while
    # /docker-entrypoint-initdb.d/schema.sql is still running, and the seed must not race it
    command:
      - sh
      - -c
      - |
        until python -c "import services.db as d; d.query('SELECT 1 FROM measurement LIMIT 1')" 2>/dev/null; do
          echo "waiting for the database schema ..."
          sleep 2
        done
        exec python tools/simulate.py --demo --until-now
    depends_on:
      db:
        condition: service_healthy
    environment:
      ISPINDEL_DB_DSN: postgresql://ispindel:ispindel@db:5432/ispindel
      TZ: UTC
    volumes:
      - ./config.yml:/repo/config.yml:ro
      - ./services:/repo/services:ro
      - ./tools:/repo/tools:ro

volumes:
  pgdata:                           # NFR-04: the measurements live here
  brokerdata:
