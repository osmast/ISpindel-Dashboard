<!-- The pointer of the dashboard: the usual arrow, recoloured into the project colours, with a
     pair of beer bubbles at its tail. This is decoration - no FR/NFR asks for a custom pointer
     (NFR-05 is about the language of the UI), so no requirement id is named here.
     The arrow's tip sits at the top-left corner (3,3): main.py/input.pcss pass 3 3 as the
     cursor hotspot, so the click still lands where the tip points.
     `cursor-beer.png` is the raster twin of this file (rsvg-convert, 32x32) - SVG cursors are
     only understood by Chromium 122+/Edge, so the CSS offers the PNG first and this file as the
     second candidate. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#E3982B"/>
    </linearGradient>
  </defs>

  <!-- bubbles at the tail, behind the arrow -->
  <circle cx="25" cy="25" r="3.4" fill="#FFFFFF" fill-opacity="0.75" stroke="#0057B7"
          stroke-width="1.2"/>
  <circle cx="29" cy="20" r="2" fill="#FFFFFF" fill-opacity="0.75" stroke="#0057B7"
          stroke-width="1.1"/>

  <!-- the pointer: tip at (3,3), classic arrow outline, brand colours -->
  <path d="M3 3 L3 21 L8.5 15.8 L12.2 23.6 L15.4 22.1 L11.8 14.4 L19 14.4 Z"
        fill="url(#amber)" stroke="#0057B7" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
