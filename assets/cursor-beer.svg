<!-- The pointer while it is NOT over anything clickable: an EMPTY beer glass - the same glass as the
     live pointer of assets/cursor.js, scaled from its 48 x 48 design down to 32 x 32 (factor 2/3).
     This file is the fallback: the live pointer is the glass that follows the mouse and fills up on
     hover; this static one is what a browser without JavaScript shows - and, more relevant, what a
     reader who asked for reduced motion gets, because cursor.js stands down for them.
     Hotspot 7 7 = the rim of the glass (11,10 in the 48-unit design), so a click lands exactly where
     the drawing points; the filled dot marks that point. Decoration - no FR/NFR asks for a custom
     pointer (NFR-05 is about the language of the UI), so no requirement id is named here.
     `cursor-beer.png` is the raster twin (rsvg-convert, 32x32) - SVG cursors are only understood by
     Chromium 122+/Edge, so the CSS offers the PNG first and this file as the second candidate.
     Colours: brand blue #0057B7 for the glass (a white outline would vanish on the white panels),
     the beer gradient of the original design. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <clipPath id="glass-inner">
      <path d="M8 8 H18.7 L17.3 25.3 C17.3 26.1 16.7 26.7 16 26.7 H10.7 C9.9 26.7 9.3 26.1 9.3 25.3 Z"/>
    </clipPath>
    <linearGradient id="beer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="60%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
  </defs>

  <!-- the handle -->
  <path d="M18 10.7 H22 C23.5 10.7 24.7 11.9 24.7 13.3 V18.7 C24.7 20.1 23.5 21.3 22 21.3 H17.3"
        stroke="#0057B7" stroke-width="2.2" stroke-linecap="round"/>

  <!-- the glass itself: white, slightly transparent, so it reads on the yellow page and on white -->
  <path d="M7.3 6.7 H19.3 L17.9 25.5 C17.8 26.5 16.9 27.3 15.8 27.3 H10.9 C9.8 27.3 8.9 26.5 8.8 25.5 Z"
        fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- what is left at the bottom of the glass -->
  <g clip-path="url(#glass-inner)">
    <rect x="8" y="22.7" width="11" height="4.5" fill="url(#beer)"/>
  </g>

  <!-- the outline and its reflection, on top of the fill -->
  <path d="M7.3 6.7 H19.3 L17.9 25.5 C17.8 26.5 16.9 27.3 15.8 27.3 H10.9 C9.8 27.3 8.9 26.5 8.8 25.5 Z"
        stroke="#0057B7" stroke-width="1.7" stroke-linejoin="round"/>
  <line x1="9.7" y1="9.3" x2="10.3" y2="24" stroke="#0057B7" stroke-width="0.9" opacity="0.4"/>

  <!-- the exact click point (the hotspot) -->
  <circle cx="7.3" cy="6.7" r="1.5" fill="#0057B7" stroke="#FFFFFF" stroke-width="0.9"/>
</svg>
