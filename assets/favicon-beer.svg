<!-- Tab icon of the dashboard: a beer mug in the project colours.
     This is decoration - no FR/NFR asks for a browser-tab icon (NFR-05 is about the language of
     the UI), so no requirement id is named here.
     Served statically from assets/ and linked through the {%favicon%} placeholder of the index
     template in main.py: Dash only auto-links a file named `favicon.ico`, and always as
     `image/x-icon`, so an SVG has to be wired up by hand.
     Colours: the page yellow #FFDD00 and the brand blue #0057B7 of assets/input.pcss. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="iSpindel fermentation monitor">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFDD00" stroke="#0057B7"
        stroke-width="3"/>

  <!-- handle, drawn first so the mug covers its ends -->
  <path d="M43 28h4a8 8 0 0 1 0 16h-4" fill="none" stroke="#0057B7" stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- the beer -->
  <rect x="12" y="22" width="31" height="30" rx="5" fill="#E8A33D" stroke="#0057B7"
        stroke-width="3.5"/>

  <!-- the head of foam, overlapping the top edge of the mug -->
  <rect x="10" y="15" width="35" height="13" rx="6.5" fill="#FFFFFF" stroke="#0057B7"
        stroke-width="3.5"/>

  <!-- carbon dioxide rising in the beer -->
  <circle cx="20" cy="36" r="2.6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="29" cy="43" r="1.9" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="34" cy="31" r="1.5" fill="#FFFFFF" opacity="0.85"/>
</svg>
